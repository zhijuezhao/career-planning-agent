services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: career_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: career_planning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: career_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  admin-frontend:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
    container_name: career_admin_frontend
    volumes:
      - admin_frontend_dist:/app/dist

  student-frontend:
    build:
      context: ./frontend/student
      dockerfile: Dockerfile
    container_name: career_student_frontend
    volumes:
      - student_frontend_dist:/app/dist

  nginx:
    image: nginx:alpine
    container_name: career_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - admin_frontend_dist:/usr/share/nginx/html/admin:ro
      - student_frontend_dist:/usr/share/nginx/html/student:ro
    depends_on:
      - backend
      - admin-frontend
      - student-frontend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: career_backend
    restart: unless-stopped
    # Locally only: host `./backend` bind-mount + Windows file sharing blocks the
    # image's non-root appuser from writing ./backend/logs, so run as root in dev.
    user: "root"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/career_planning
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8002:8001"
    volumes:
      - ./backend:/app/backend
      # 2026-09-30（P8）：移除 `uploads:/app/uploads` —— 该命名卷**从未被写入过**
      # （实测 0 文件）。上传实际落在上面那个 bind mount 内：宿主 `./backend/uploads`。
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "cd /app/backend && python -m uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload"

volumes:
  pgdata:
  redisdata:
  # 2026-09-30（P8）：`uploads:` 卷声明已删 —— 从未被使用，纯死重量。
  admin_frontend_dist:
  student_frontend_dist:
