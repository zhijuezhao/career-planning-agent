[tool.poetry]
name = "career-planning-agent"
version = "0.1.0"
description = "AI-driven career planning agent for college students"
authors = ["developer"]
readme = "README.md"
packages = [{include = "app", from = "backend"}]

[tool.poetry.dependencies]
python = "^3.12"

# Web framework
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sse-starlette = "^2.0.0"

# LangChain ecosystem
langchain = ">=0.3,<0.4"
langchain-core = ">=0.3,<0.4"
langchain-community = ">=0.3,<0.4"
langchain-openai = ">=0.2,<0.3"
langgraph = ">=0.2,<0.3"
langsmith = ">=0.1,<0.2"

# Database
# ⚠ `[asyncio]` extra 不能省：SQLAlchemy 2.1 起**不再自动安装 greenlet**，
#    而 `sqlalchemy.ext.asyncio` 没有 greenlet 会直接 ImportError
#    （2026-10-09 CI 实测：alembic env.py 导入即挂，整条迁移链跑不起来）。
#    同时把上界收到 `<2.1`：本项目/测试是在 2.0.x 上开发验证的，升 2.1 应单独做一遍回归。
sqlalchemy = {extras = ["asyncio"], version = ">=2.0.35,<2.1"}
# 允许 0.31（本地验证组合）；`^0.29.0` 会锁死到 0.29.x，与开发环境不一致
asyncpg = ">=0.29.0,<0.32"
alembic = "^1.13.0"
pgvector = "^0.3.0"

# Cache & scheduling
redis = "^5.1.0"
apscheduler = "^3.10.4"

# Utilities
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
# `app/schemas/user.py` 用了 `EmailStr` → pydantic 需要 email-validator，
# 否则 import 阶段直接 ImportError（2026-10-09 审计：此前只写在 CI 的临时 pip 列表里，
# 项目自身依赖清单漏了，别人 clone 下来装不起来）。
email-validator = "^2.2.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
# passlib 1.7.4 与 bcrypt 5.x 不兼容（读 `bcrypt.__about__` 失败），
# 这里显式钉在 4.0.x —— 与开发环境一致，也避免 CI 装到 5.x 才炸。
bcrypt = ">=4.0.1,<4.1"
python-multipart = "^0.0.12"
loguru = "^0.7.2"
httpx = "^0.27.0"
beautifulsoup4 = "^4.12.0"
# `app/core/link_enrich/extract.py` 直接 `from lxml import html`（XPath 提取），
# 它是直接依赖而非可选传递依赖，必须显式声明。
lxml = "^5.3.0"
pdfplumber = "^0.11.4"
python-docx = "^1.1.0"
pandas = "^2.1.4"
openpyxl = "^3.1.0"
xlrd = "^2.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
ruff = "^0.7.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["N818"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["backend/tests"]
