<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方案 A - 经典侧边栏布局</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #app { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .admin-container { display: flex; height: 100vh; }
    .sidebar { width: 220px; background: #001529; color: #fff; display: flex; flex-direction: column; transition: width 0.3s; }
    .sidebar.collapsed { width: 64px; }
    .logo { height: 60px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; border-bottom: 1px solid #1f2d3d; }
    .logo.collapsed span { display: none; }
    .menu { flex: 1; border-right: none; background: #001529; }
    .menu .el-menu-item { color: rgba(255,255,255,0.7); }
    .menu .el-menu-item.is-active { background: #1890ff !important; color: #fff; }
    .menu .el-menu-item:hover { background: #000c17; color: #fff; }
    .main-container { flex: 1; display: flex; flex-direction: column; background: #f0f2f5; }
    .header { height: 60px; background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .toggle-btn { font-size: 20px; cursor: pointer; color: #606266; }
    .user-info { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .content { flex: 1; padding: 20px; overflow-y: auto; }
    .page-title { font-size: 20px; font-weight: 600; margin-bottom: 20px; color: #303133; }
    .stat-cards { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; margin-bottom: 20px; }
    .stat-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .stat-value { font-size: 32px; font-weight: bold; color: #1890ff; }
    .stat-label { margin-top: 8px; color: #909399; font-size: 14px; }
    .data-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .data-card h3 { margin-bottom: 16px; font-size: 16px; color: #303133; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ebeef5; font-size: 14px; }
    th { background: #fafafa; color: #606266; font-weight: 500; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    .tag-success { background: #f0f9eb; color: #67c23a; }
    .tag-info { background: #f4f4f5; color: #909399; }
    .tag-danger { background: #fef0f0; color: #f56c6c; }
    .pagination { display: flex; justify-content: flex-end; margin-top: 16px; gap: 8px; }
    .pagination button { padding: 6px 12px; border: 1px solid #dcdfe6; background: #fff; border-radius: 4px; cursor: pointer; }
    .pagination button.active { background: #1890ff; color: #fff; border-color: #1890ff; }
  </style>
</head>
<body>
  <div id="app">
    <div class="admin-container">
      <!-- 侧边栏 -->
      <div class="sidebar" :class="{ collapsed: isCollapse }">
        <div class="logo" :class="{ collapsed: isCollapse }">
          <span v-if="!isCollapse">管理后台</span>
          <span v-else>管</span>
        </div>
        <el-menu :default-active="activeMenu" :collapse="isCollapse" class="menu" background-color="#001529" text-color="#fff" active-text-color="#fff">
          <el-menu-item v-for="item in menus" :key="item.path" :index="item.path" @click="activeMenu = item.path">
            <el-icon><component :is="item.icon" /></el-icon>
            <template #title>{{ item.title }}</template>
          </el-menu-item>
        </el-menu>
      </div>

      <!-- 主内容区 -->
      <div class="main-container">
        <div class="header">
          <div class="header-left">
            <el-icon class="toggle-btn" @click="isCollapse = !isCollapse">
              <fold v-if="!isCollapse" /><expand v-else />
            </el-icon>
            <el-breadcrumb separator="/">
              <el-breadcrumb-item>首页</el-breadcrumb-item>
              <el-breadcrumb-item>{{ currentPageTitle }}</el-breadcrumb-item>
            </el-breadcrumb>
          </div>
          <div class="user-info">
            <el-icon><user /></el-icon>
            <span>管理员</span>
            <el-icon><arrow-down /></el-icon>
          </div>
        </div>

        <div class="content">
          <div class="page-title">{{ currentPageTitle }}</div>

          <!-- 统计卡片 -->
          <div class="stat-cards">
            <div class="stat-card">
              <div class="stat-value">1,234</div>
              <div class="stat-label">用户总数</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">856</div>
              <div class="stat-label">简历总数</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">423</div>
              <div class="stat-label">岗位画像</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">2,156</div>
              <div class="stat-label">匹配次数</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">389</div>
              <div class="stat-label">报告数量</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">567</div>
              <div class="stat-label">对话会话</div>
            </div>
          </div>

          <!-- 数据表格 -->
          <div class="data-card">
            <h3>最近用户</h3>
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>用户名</th>
                  <th>邮箱</th>
                  <th>角色</th>
                  <th>状态</th>
                  <th>注册时间</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="user in users" :key="user.id">
                  <td>{{ user.id }}</td>
                  <td>{{ user.username }}</td>
                  <td>{{ user.email }}</td>
                  <td><span class="tag" :class="user.role === 'admin' ? 'tag-danger' : 'tag-info'">{{ user.role }}</span></td>
                  <td><span class="tag" :class="user.status === 1 ? 'tag-success' : 'tag-info'">{{ user.status === 1 ? '启用' : '禁用' }}</span></td>
                  <td>{{ user.created_at }}</td>
                </tr>
              </tbody>
            </table>
            <div class="pagination">
              <button>上一页</button>
              <button class="active">1</button>
              <button>2</button>
              <button>3</button>
              <button>下一页</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, computed } = Vue
    const { Fold, Expand, User, ArrowDown, Odometer, Briefcase, Document, Upload, Connection, TrendCharts, UserFilled, DocumentChecked, ChatDotRound, Setting } = ElementPlusIconsVue

    const app = createApp({
      setup() {
        const isCollapse = ref(false)
        const activeMenu = ref('dashboard')
        const menus = [
          { path: 'dashboard', title: '仪表盘', icon: 'Odometer' },
          { path: 'jobs', title: '岗位管理', icon: 'Briefcase' },
          { path: 'raw-data', title: '原始数据', icon: 'Document' },
          { path: 'import', title: '数据导入', icon: 'Upload' },
          { path: 'matching', title: '匹配管理', icon: 'Connection' },
          { path: 'career', title: '职业路线', icon: 'TrendCharts' },
          { path: 'users', title: '用户管理', icon: 'UserFilled' },
          { path: 'reports', title: '报告管理', icon: 'DocumentChecked' },
          { path: 'chat', title: '对话记录', icon: 'ChatDotRound' },
          { path: 'system', title: '系统配置', icon: 'Setting' },
        ]
        const users = [
          { id: 1, username: '张三', email: 'zhangsan@example.com', role: 'student', status: 1, created_at: '2026-09-01' },
          { id: 2, username: '李四', email: 'lisi@example.com', role: 'student', status: 1, created_at: '2026-09-02' },
          { id: 3, username: '王五', email: 'wangwu@example.com', role: 'admin', status: 1, created_at: '2026-09-03' },
          { id: 4, username: '赵六', email: 'zhaoliu@example.com', role: 'student', status: 0, created_at: '2026-09-04' },
          { id: 5, username: '钱七', email: 'qianqi@example.com', role: 'student', status: 1, created_at: '2026-09-05' },
        ]
        const currentPageTitle = computed(() => {
          const item = menus.find(m => m.path === activeMenu.value)
          return item ? item.title : '仪表盘'
        })
        return { isCollapse, activeMenu, menus, users, currentPageTitle, Fold, Expand, User, ArrowDown, Odometer, Briefcase, Document, Upload, Connection, TrendCharts, UserFilled, DocumentChecked, ChatDotRound, Setting }
      }
    })
    for (const [key, component] of Object.entries(ElementPlusIconsVue)) { app.component(key, component) }
    app.use(ElementPlus).mount('#app')
  </script>
</body>
</html>
