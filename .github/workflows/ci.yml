name: CI

# 2026-10-09 安全审计 M-1：这里原先只监听 main/develop，而仓库默认分支是 **master**
# → 工作流从未触发过（GitHub Actions 页面"This repository has no workflow runs yet"）。
on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

# 最小权限：CI 只需要读代码（原先未声明，默认 token 权限可能可写）
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install ruff

      - name: Lint with ruff
        run: ruff check backend/

  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: career_planning
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/career_planning
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production
      APP_ENV: development

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # 2026-10-09 安全审计 M-2：原先这里手写一份 pip 列表，与 pyproject.toml 漂移
          # （缺 pdfplumber / beautifulsoup4 / xlrd，反而多装 pypdf2）→ 改成以
          # pyproject.toml 为唯一来源，再补测试期依赖。
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pytest-cov

      - name: Run database migrations
        working-directory: backend
        run: |
          python -m alembic upgrade head

      - name: Unit tests
        working-directory: backend
        run: |
          python -m pytest tests/test_core/ -v --cov=app/core --cov-report=term-missing

      - name: Integration tests
        working-directory: backend
        run: |
          python -m pytest tests/test_api/ -v
