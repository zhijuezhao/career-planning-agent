[pytest]
# 为什么需要这个文件：
# 仓库根的 pyproject.toml 有 [tool.pytest.ini_options] asyncio_mode="auto"，
# 但实际跑测试的目录是 backend/（计划 Task 16 Step 1 命令：`cd backend && pytest -q`），
# pytest 的 rootdir 落在 backend/，**读不到仓库根的配置** → 所有 `async def` 测试报
# "async def functions are not natively supported"（2026-09-18 实测：test_llm_gateway 8 个全挂）。
# 本文件把同一配置放到测试实际运行目录，保证两种跑法都生效。
#
# ⚠️ 不要加 `pythonpath = .`：实测会改变 tests/ 的模块导入方式（rootdir 由 pyproject 变为
#    pytest.ini 后，tests/ 下模块的导入路径随之变化），导致 test_journey_status/test_matching_new/
#    test_report_records 等出现新的 collected 重复与夹具冲突，错误数从 9 升到 13。
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = tests
