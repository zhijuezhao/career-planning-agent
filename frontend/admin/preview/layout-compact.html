<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方案 C - 紧凑图标布局</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #app { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .admin-container { display: flex; height: 100vh; }
    .sidebar { width: 64px; background: #1e293b; display: flex; flex-direction: column; align-items: center; padding-top: 16px; }
    .sidebar.expanded { width: 180px; }
    .logo { width: 40px; height: 40px; background: #3b82f6; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; margin-bottom: 24px; }
    .sidebar.expanded .logo { width: auto; padding: 0 16px; }
    .menu-item { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 10px; margin-bottom: 4px; cursor: pointer; color: #94a3b8; transition: all 0.2s; position: relative; }
    .menu-item:hover { background: #334155; color: #fff; }
    .menu-item.active { background: #3b82f6; color: #fff; }
    .sidebar.expanded .menu-item { width: 100%; height: 44px; padding: 0 16px; justify-content: flex-start; gap: 12px; border-radius: 8px; }
    .menu-item .menu-text { display: none; font-size: 14px; }
    .sidebar.expanded .menu-item .menu-text { display: inline; }
    .main-container { flex: 1; display: flex; flex-direction: column; background: #f8fafc; }
    .header { height: 56px; background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #e2e8f0; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .toggle-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; color: #64748b; }
    .toggle-btn:hover { background: #f1f5f9; }
    .page-title-header { font-size: 16px; font-weight: 600; color: #1e293b; }
    .user-avatar { width: 32px; height: 32px; background: #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; cursor: pointer; }
    .content { flex: 1; padding: 20px; overflow-y: auto; }
    .stat-cards { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 20px; }
    .stat-card { border-radius: 10px; padding: 16px 18px; color: #fff; }
    .stat-card:nth-child(1) { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .stat-card:nth-child(2) { background: linear-gradient(135deg, #22c55e, #16a34a); }
    .stat-card:nth-child(3) { background: linear-gradient(135deg, #f97316, #ea580c); }
    .stat-card:nth-child(4) { background: linear-gradient(135deg, #a855f7, #7c3aed); }
    .stat-card:nth-child(5) { background: linear-gradient(135deg, #06b6d4, #0891b2); }
    .stat-card:nth-child(6) { background: linear-gradient(135deg, #ec4899, #db2777); }
    .stat-value { font-size: 26px; font-weight: 700; }
    .stat-label { margin-top: 4px; font-size: 12px; opacity: 0.9; }
    .data-card { background: #fff; border-radius: 10px; padding: 20px; border: 1px solid #e2e8f0; }
    .data-card h3 { margin-bottom: 16px; font-size: 15px; color: #1e293b; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; font-size: 13px; border-bottom: 1px solid #f1f5f9; }
    th { color: #64748b; font-weight: 500; }
    td { color: #334155; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
    .tag-success { background: #dcfce7; color: #16a34a; }
    .tag-info { background: #f1f5f9; color: #64748b; }
    .tag-danger { background: #fee2e2; color: #dc2626; }
    .pagination { display: flex; justify-content: flex-end; margin-top: 16px; gap: 6px; }
    .pagination button { padding: 6px 12px; border: 1px solid #e2e8f0; background: #fff; border-radius: 6px; cursor: pointer; font-size: 12px; color: #64748b; }
    .pagination button.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
  </style>
</head>
<body>
  <div id="app">
    <div class="admin-container">
      <!-- 侧边栏 -->
      <div class="sidebar" :class="{ expanded: isExpand }">
        <div class="logo">{{ isExpand ? '管理后台' : '管' }}</div>
        <div v-for="item in menus" :key="item.path" class="menu-item" :class="{ active: activeMenu === item.path }" @click="activeMenu = item.path">
          <el-icon><component :is="item.icon" /></el-icon>
          <span class="menu-text">{{ item.title }}</span>
        </div>
      </div>

      <!-- 主内容区 -->
      <div class="main-container">
        <div class="header">
          <div class="header-left">
            <div class="toggle-btn" @click="isExpand = !isExpand">
              <el-icon><expand v-if="!isExpand" /><fold v-else /></el-icon>
            </div>
            <span class="page-title-header">{{ currentPageTitle }}</span>
          </div>
          <div class="user-avatar">管</div>
        </div>

        <div class="content">
          <!-- 统计卡片 -->
          <div class="stat-cards">
            <div class="stat-card">
              <div class="stat-value">1,234</div>
              <div class="stat-label">用户总数</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">856</div>
              <div class="stat-label">简历总数</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">423</div>
              <div class="stat-label">岗位画像</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">2,156</div>
              <div class="stat-label">匹配次数</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">389</div>
              <div class="stat-label">报告数量</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">567</div>
              <div class="stat-label">对话会话</div>
            </div>
          </div>

          <!-- 数据表格 -->
          <div class="data-card">
            <h3>最近用户</h3>
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>用户名</th>
                  <th>邮箱</th>
                  <th>角色</th>
                  <th>状态</th>
                  <th>注册时间</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="user in users" :key="user.id">
                  <td>{{ user.id }}</td>
                  <td>{{ user.username }}</td>
                  <td>{{ user.email }}</td>
                  <td><span class="tag" :class="user.role === 'admin' ? 'tag-danger' : 'tag-info'">{{ user.role }}</span></td>
                  <td><span class="tag" :class="user.status === 1 ? 'tag-success' : 'tag-info'">{{ user.status === 1 ? '启用' : '禁用' }}</span></td>
                  <td>{{ user.created_at }}</td>
                </tr>
              </tbody>
            </table>
            <div class="pagination">
              <button>上一页</button>
              <button class="active">1</button>
              <button>2</button>
              <button>3</button>
              <button>下一页</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, computed } = Vue
    const { Expand, Fold, Odometer, Briefcase, Document, Upload, Connection, TrendCharts, User, DocumentChecked, ChatDotRound, Setting } = ElementPlusIconsVue
    const app = createApp({
      setup() {
        const isExpand = ref(false)
        const activeMenu = ref('dashboard')
        const menus = [
          { path: 'dashboard', title: '仪表盘', icon: 'Odometer' },
          { path: 'jobs', title: '岗位管理', icon: 'Briefcase' },
          { path: 'raw-data', title: '原始数据', icon: 'Document' },
          { path: 'import', title: '数据导入', icon: 'Upload' },
          { path: 'matching', title: '匹配管理', icon: 'Connection' },
          { path: 'career', title: '职业路线', icon: 'TrendCharts' },
          { path: 'users', title: '用户管理', icon: 'User' },
          { path: 'reports', title: '报告管理', icon: 'DocumentChecked' },
          { path: 'chat', title: '对话记录', icon: 'ChatDotRound' },
          { path: 'system', title: '系统配置', icon: 'Setting' },
        ]
        const users = [
          { id: 1, username: '张三', email: 'zhangsan@example.com', role: 'student', status: 1, created_at: '2026-09-01' },
          { id: 2, username: '李四', email: 'lisi@example.com', role: 'student', status: 1, created_at: '2026-09-02' },
          { id: 3, username: '王五', email: 'wangwu@example.com', role: 'admin', status: 1, created_at: '2026-09-03' },
          { id: 4, username: '赵六', email: 'zhaoliu@example.com', role: 'student', status: 0, created_at: '2026-09-04' },
          { id: 5, username: '钱七', email: 'qianqi@example.com', role: 'student', status: 1, created_at: '2026-09-05' },
        ]
        const currentPageTitle = computed(() => {
          const item = menus.find(m => m.path === activeMenu.value)
          return item ? item.title : '仪表盘'
        })
        return { isExpand, activeMenu, menus, users, currentPageTitle, Expand, Fold, Odometer, Briefcase, Document, Upload, Connection, TrendCharts, User, DocumentChecked, ChatDotRound, Setting }
      }
    })
    for (const [key, component] of Object.entries(ElementPlusIconsVue)) { app.component(key, component) }
    app.use(ElementPlus).mount('#app')
  </script>
</body>
</html>
